name: Iridescence 001 experimental regression
on:
  push:
    branches:
      - experiment/iridescence-001
  workflow_dispatch:
jobs:
  node-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax-check browser modules
        run: |
          for file in js/*.js; do node --check "$file"; done
      - name: Run baseline and material lab tests
        run: node --test tests/*.test.cjs
      - name: Prepare headless Mesa/EGL validation
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-venv libegl1 libgles2 libgl1-mesa-dri
          python3 -m venv .venv
          .venv/bin/pip install --quiet numpy Pillow
      - name: Render iridescent home and compile actual GLES shader
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          EGL_PLATFORM: surfaceless
        run: |
          node tools/export-iridescence-proof.cjs
          .venv/bin/python tools/verify-render.py qa/iridescence
      - name: Publish proof images and GPU report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iridescence-001-gles-proof
          path: |
            qa/iridescence/*.png
            qa/iridescence/graphics-results.json
          if-no-files-found: warn
          retention-days: 14
